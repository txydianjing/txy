<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>txy电竞 · 暗区突围俱乐部</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0a0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 70px; }
        .app { max-width: 500px; margin: 0 auto; background: #0f0f14; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #0a0a15 100%); padding: 24px 20px; text-align: center; border-bottom: 1px solid rgba(255,107,53,0.3); }
        .header h1 { font-size: 28px; letter-spacing: 2px; background: linear-gradient(135deg, #FF6B35, #FFD700); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header p { font-size: 12px; color: #888; margin-top: 6px; }
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; background: rgba(26,26,46,0.8); backdrop-filter: blur(10px); margin: 20px; padding: 20px 12px; border-radius: 28px; border: 1px solid rgba(255,107,53,0.2); }
        .menu-item { text-align: center; cursor: pointer; transition: transform 0.2s; }
        .menu-item:active { transform: scale(0.95); }
        .menu-icon { font-size: 32px; display: block; filter: drop-shadow(0 0 4px rgba(255,107,53,0.5)); }
        .menu-name { font-size: 12px; color: #ccc; margin-top: 8px; }
        .card { background: rgba(26,26,46,0.6); backdrop-filter: blur(10px); margin: 16px; border-radius: 28px; padding: 20px; border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s; }
        .card-title { font-weight: 600; margin-bottom: 16px; font-size: 16px; color: #fff; display: flex; justify-content: space-between; letter-spacing: 0.5px; }
        .more { color: #FF6B35; font-size: 12px; cursor: pointer; }
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .order-info { display: flex; gap: 16px; color: #ddd; font-size: 14px; }
        .order-price { color: #FFD700; font-weight: bold; }
        .badge { background: rgba(255,107,53,0.2); color: #FF6B35; padding: 4px 12px; border-radius: 20px; font-size: 11px; border: 1px solid rgba(255,107,53,0.3); }
        .player-row { display: flex; justify-content: space-around; margin-top: 8px; }
        .player-item { text-align: center; width: 80px; }
        .player-avatar { width: 60px; height: 60px; background: linear-gradient(135deg, #FF6B35, #FF8C42); border-radius: 50%; margin: 0 auto 8px; box-shadow: 0 0 12px rgba(255,107,53,0.4); }
        .player-name { font-size: 14px; font-weight: 600; color: #fff; }
        .player-rank { font-size: 11px; color: #FFD700; }
        .list-item { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; color: #ddd; cursor: pointer; }
        .btn { background: linear-gradient(135deg, #FF6B35, #FF8C42); color: white; border: none; padding: 14px; border-radius: 40px; width: 100%; font-size: 16px; font-weight: 600; margin-top: 12px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(255,107,53,0.3); }
        .btn:active { transform: scale(0.98); }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: rgba(10,10,20,0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 10px 16px 20px; border-top: 1px solid rgba(255,107,53,0.2); z-index: 100; }
        .tab-item { text-align: center; font-size: 12px; color: #888; cursor: pointer; transition: all 0.2s; }
        .tab-item.active { color: #FF6B35; text-shadow: 0 0 8px rgba(255,107,53,0.5); }
        .tab-icon { font-size: 24px; display: block; margin-bottom: 4px; }
        .modal-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-container { background: rgba(26,26,46,0.95); border: 1px solid rgba(255,107,53,0.3); width: 80%; border-radius: 32px; padding: 24px; text-align: center; backdrop-filter: blur(10px); }
        .modal-container p { color: #fff; margin-bottom: 20px; }
        .modal-container button { background: linear-gradient(135deg, #FF6B35, #FF8C42); border: none; padding: 12px; border-radius: 40px; width: 100%; color: white; font-weight: bold; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
    </style>
</head>
