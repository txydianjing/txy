<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>txy电竞 · 暗区突围俱乐部</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 70px; }
        .app { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 16px; color: white; text-align: center; }
        .header h1 { font-size: 24px; }
        .header p { font-size: 12px; opacity: 0.8; }
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 20px; background: white; margin: 16px; border-radius: 20px; }
        .menu-item { text-align: center; }
        .menu-icon { font-size: 32px; display: block; }
        .menu-name { font-size: 12px; color: #666; margin-top: 8px; }
        .card { background: white; margin: 16px; border-radius: 20px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-weight: bold; margin-bottom: 12px; font-size: 16px; }
        .order-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .order-price { color: #ff6b35; font-weight: bold; }
        .badge { background: #ff6b35; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 8px 16px; border-top: 1px solid #eee; }
        .tab-item { text-align: center; font-size: 12px; color: #999; }
        .tab-item.active { color: #ff6b35; }
        .tab-icon { font-size: 22px; display: block; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>txy电竞</h1>
        <p>暗区突围 · 俱乐部</p>
    </div>

    <div id="page-home" class="page active">
        <div class="menu-grid">
            <div class="menu-item" onclick="showToast('发布订单')"><span class="menu-icon">📝</span><span class="menu-name">发布订单</span></div>
            <div class="menu-item" onclick="showToast('抢单大厅')"><span class="menu-icon">⚡</span><span class="menu-name">抢单大厅</span></div>
            <div class="menu-item" onclick="showToast('俱乐部')"><span class="menu-icon">🏛️</span><span class="menu-name">俱乐部</span></div>
            <div class="menu-item" onclick="showToast('我的')"><span class="menu-icon">👤</span><span class="menu-name">我的</span></div>
        </div>
        
        <div class="card">
            <div class="card-title">🔥 热门订单</div>
            <div class="order-item"><span>农场 · 护航</span><span class="order-price">¥88</span><span class="badge">待接单</span></div>
            <div class="order-item"><span>电视台 · 代练</span><span class="order-price">¥128</span><span class="badge">进行中</span></div>
            <div class="order-item"><span>山谷 · 教学</span><span class="order-price">¥99</span><span class="badge">已完成</span></div>
        </div>
        
        <div class="card">
            <div class="card-title">⭐ 明星打手</div>
            <div style="display: flex; gap: 16px; justify-content: space-around;">
                <div style="text-align:center"><div style="width:50px;height:50px;background:#ddd;border-radius:50%;margin:0 auto"></div><div>金牌·张三</div></div>
                <div style="text-align:center"><div style="width:50px;height:50px;background:#ddd;border-radius:50%;margin:0 auto"></div><div>银牌·李四</div></div>
                <div style="text-align:center"><div style="width:50px;height:50px;background:#ddd;border-radius:50%;margin:0 auto"></div><div>铜牌·王五</div></div>
            </div>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="card">
            <div class="card-title">个人中心</div>
            <div class="order-item" onclick="showToast('我的订单')"><span>📋 我的订单</span><span>›</span></div>
            <div class="order-item" onclick="showToast('我的钱包')"><span>💰 我的钱包</span><span>›</span></div>
            <div class="order-item" onclick="showToast('我的俱乐部')"><span>🏛️ 我的俱乐部</span><span>›</span></div>
            <div class="order-item" onclick="showToast('设置')"><span>⚙️ 设置</span><span>›</span></div>
        </div>
    </div>

    <div class="tabbar">
        <div class="tab-item active" data-page="home"><span class="tab-icon">🏠</span><span>首页</span></div>
        <div class="tab-item" data-page="profile"><span class="tab-icon">👤</span><span>我的</span></div>
    </div>
</div>

<script>
    function showToast(msg) { alert(msg); }
    document.querySelectorAll('.tab-item').forEach(tab => {
        tab.addEventListener('click', function() {
            const pageId = this.getAttribute('data-page');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });
    });
</script>
</body>
</html>
